<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rune System</title>
  <style>
    :root { --bg:#0d0d0d; --fg:#e8e0d0; --accent:#c9a84c; --dim:#555; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: monospace;
           display: flex; flex-direction: column; align-items: center;
           min-height: 100vh; padding: 2rem 1rem; }
    h1   { color: var(--accent); font-size: 2rem; letter-spacing: .15em; margin-bottom: .4rem; }
    .sub { color: var(--dim); font-size: .8rem; margin-bottom: 2rem; }
    section { width: 100%; max-width: 680px; margin-bottom: 2rem; }
    h2   { color: var(--accent); border-bottom: 1px solid var(--dim);
           padding-bottom: .3rem; margin-bottom: .8rem; font-size: 1rem; }
    pre  { background: #1a1a1a; border: 1px solid #333; border-radius: 4px;
           padding: 1rem; overflow-x: auto; font-size: .82rem; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: .4rem .6rem;
             border-bottom: 1px solid #222; }
    th { color: var(--accent); }
    .glyph { font-size: 1.4rem; }
    button { background: #1e1a0e; color: var(--accent); border: 1px solid var(--accent);
             border-radius: 3px; padding: .4rem 1rem; cursor: pointer;
             font-family: monospace; font-size: .85rem; margin-top: .6rem; }
    button:hover { background: #2e2810; }
    .ok  { color: #6f6; }
    .err { color: #f66; }
  </style>
</head>
<body>
  <h1>ᚠ Rune System</h1>
  <p class="sub">local-first AI coding node</p>

  <section>
    <h2>Backend Health</h2>
    <pre id="health">loading…</pre>
    <button onclick="loadHealth()">↺ Refresh</button>
  </section>

  <section>
    <h2>Runes</h2>
    <table>
      <thead><tr><th>Glyph</th><th>Name</th><th>Meaning</th></tr></thead>
      <tbody id="rune-rows"><tr><td colspan="3">loading…</td></tr></tbody>
    </table>
    <button onclick="loadRunes()">↺ Refresh</button>
  </section>

  <script>
    async function loadHealth() {
      const el = document.getElementById('health');
      try {
        const r = await fetch('/health');
        const d = await r.json();
        el.textContent = JSON.stringify(d, null, 2);
        el.className = r.ok ? 'ok' : 'err';
      } catch (e) {
        el.textContent = 'Error: ' + e.message;
        el.className = 'err';
      }
    }

    async function loadRunes() {
      const tbody = document.getElementById('rune-rows');
      try {
        const r = await fetch('/runes');
        const rows = await r.json();
        if (!Array.isArray(rows) || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">no runes found</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(r =>
          `<tr>
             <td class="glyph">${esc(r.glyph)}</td>
             <td>${esc(r.name)}</td>
             <td>${esc(r.meaning)}</td>
           </tr>`
        ).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="3" class="err">Error: ${esc(e.message)}</td></tr>`;
      }
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    loadHealth();
    loadRunes();
  </script>
</body>
</html>
